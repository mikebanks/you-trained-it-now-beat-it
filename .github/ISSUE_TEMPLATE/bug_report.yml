name: Activity bug
description: Report a problem with the browser demo or teaching materials
body:
  - type: markdown
    attributes:
      value: Use fictional examples only. Do not include student or personal information. Report security issues privately through SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the phase or page, steps to reproduce, and expected behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and activity version
      description: Include whether you used the downloaded file or website.
    validations:
      required: true
